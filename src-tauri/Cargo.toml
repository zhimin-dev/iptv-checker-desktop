[package]
name = "iptv-checker-player"
version = "0.1.0"
description = "Jellyfin-like IPTV player client for iptv-checker server"
authors = ["知敏studio"]
edition = "2021"

[lib]
name = "iptv_checker_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
